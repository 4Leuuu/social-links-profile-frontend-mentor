<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gray-900: #141414;
      --gray-800: #1f1f1f;
      --gray-700: #333333;
      --green: #c4f82a;
      --white: #ffffff;

      --text-1: 700 1.5rem/1.5 "Inter", sans-serif;
      --text-2: 400 0.875rem/1.5 "Inter", sans-serif;
      --text-2-bold: 700 0.875rem/1.5 "Inter", sans-serif;

      --letter-spacing: 0px;

      --spacing-50: 0.25rem; 
      --spacing-100: 0.5rem; 
      --spacing-150: 0.75rem;
      --spacing-200: 1rem;   
      --spacing-300: 1.5rem;  
      --spacing-400: 2rem;    
      --spacing-500: 2.5rem;

    }

    ul,
    li {
      list-style: none;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      height: 100dvh;
      background-color: var(--gray-900);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--spacing-300);
    }
    
    .card {
      padding: var(--spacing-500);
      border-radius: 12px;
      background-color: var(--gray-800);
      width: 100%;
      max-width: 384px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-300);
    }
    
    .button-link {
      display: block;
      width: 100%;
      padding: var(--spacing-150);
      border: none;
      border-radius: 8px;
      background-color: var(--gray-700);
      font: var(--text-2-bold);
      color: var(--white);
      text-align: center;
      transition: background-color 300ms, color 300ms;
    }
     
    .button-link:hover {
      background-color: var(--green);
      color: var(--gray-700);
      cursor: pointer;
    }

    .card > img {
      border-radius: 100%;
    }

    .card-title {
      text-align: center;
      font: var(--text-2-bold);
      color: var(--green);
    }

    .card-title > h1{
      text-align: center;
      font: var(--text-1);
      color: var(--white);
      margin-bottom: (var(--spacing-50));
    }

    .card-description {
      font: var(--text-2);
      color: var(--white);
    }

    main > nav {
      width: 100%;
    }

    .card-links {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: var(--spacing-200);
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" width="88" height="88" class="avatar">
    <div class="card-title">
      <h1>Jessica Randall</h1>
      <p>London, United Kingdom</p>
    </div>
    <p class="card-description">"Front-end developer and avid reader."</p>
    <nav>
      <ul class="card-links">
        <li><a href="#" class="button-link">GitHub</a></li>
        <li><a href="#" class="button-link">Frontend Mentor</a></li>
        <li><a href="#" class="button-link">LinkedIn</a></li>
        <li><a href="#" class="button-link">Twitter</a></li>
        <li><a href="#" class="button-link">Instagram</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
